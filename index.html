<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Snack & Moi</title>
<meta name="description" content="Prospection commerciale Snack &amp; Moi : carte des points de vente, fiches contact et comptes rendus de visite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --bg:#faf7f1;
    --surface:#ffffff;
    --surface-2:#f1ece0;
    --ink:#232d24;
    --ink-soft:#5b6b5c;
    --ink-faint:#8b9a8a;
    --border:#e3dcc8;
    --border-soft:#ece5d5;
    --primary:#2f5233;
    --primary-ink:#ffffff;
    --primary-soft:#e2ead9;
    --accent:#c1442d;
    --accent-soft:#f6e2d6;
    --warn:#a9700f;
    --warn-soft:#f5e6c7;
    --good:#2f7a4f;
    --good-soft:#dcefe0;
    --danger:#b23a2e;
    --danger-soft:#f7ded9;
    --map-bg:#efe8d8;
    --map-line:#d9cfb4;
    --map-sea:#c7dbd9;
    --map-sea-line:#9fc0bd;
    --map-border:#b0a687;
    --shadow:0 1px 2px rgba(35,45,36,.06), 0 8px 24px -12px rgba(35,45,36,.18);
    --font-display:'Fraunces',ui-serif,Georgia,serif;
    --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161c17;
      --surface:#1f2620;
      --surface-2:#242c25;
      --ink:#eae5d6;
      --ink-soft:#a7b3a5;
      --ink-faint:#77857a;
      --border:#333e30;
      --border-soft:#2b3529;
      --primary:#7cc696;
      --primary-ink:#0f1710;
      --primary-soft:#26362a;
      --accent:#e38863;
      --accent-soft:#3a2a22;
      --warn:#e3b15a;
      --warn-soft:#3a3120;
      --good:#7cc696;
      --good-soft:#233129;
      --danger:#e58c80;
      --danger-soft:#3a2521;
      --map-bg:#1c231d;
      --map-line:#303a2c;
      --map-sea:#16262a;
      --map-sea-line:#254349;
      --map-border:#4a5642;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161c17;
    --surface:#1f2620;
    --surface-2:#242c25;
    --ink:#eae5d6;
    --ink-soft:#a7b3a5;
    --ink-faint:#77857a;
    --border:#333e30;
    --border-soft:#2b3529;
    --primary:#7cc696;
    --primary-ink:#0f1710;
    --primary-soft:#26362a;
    --accent:#e38863;
    --accent-soft:#3a2a22;
    --warn:#e3b15a;
    --warn-soft:#3a3120;
    --good:#7cc696;
    --good-soft:#233129;
    --danger:#e58c80;
    --danger-soft:#3a2521;
    --map-bg:#1c231d;
    --map-line:#303a2c;
    --map-sea:#16262a;
    --map-sea-line:#254349;
    --map-border:#4a5642;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:100svh;
    max-width:100%;
    padding-inline:0;
  }
  button{font-family:inherit;font-size:inherit;color:inherit;}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,a:focus-visible{
    outline:2px solid var(--primary); outline-offset:2px;
  }
  .tabular{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  header.topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:10px 16px 0;
  }
  .topbar-row{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .brand{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .brand .name{
    font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand .sub{font-size:11.5px; color:var(--ink-faint);}
  .me-chip{
    border:1px solid var(--border); background:var(--surface-2);
    border-radius:100px; padding:5px 10px; font-size:12px; font:inherit; color:var(--ink-soft);
    white-space:nowrap; cursor:pointer; max-width:150px;
  }
  nav.tabs{display:flex; gap:2px; margin-top:10px;}
  nav.tabs button{
    flex:1; background:none; border:none; padding:9px 4px 10px;
    font-size:12.5px; font-weight:600; color:var(--ink-faint);
    border-bottom:2px solid transparent; cursor:pointer;
  }
  nav.tabs button.active{color:var(--primary); border-bottom-color:var(--primary);}

  /* ---------- filter bar ---------- */
  .filterbar{
    display:flex; gap:8px; padding:10px 16px; background:var(--bg);
    border-bottom:1px solid var(--border-soft); overflow-x:auto;
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 84px); z-index:20;
  }
  .filterbar input[type=search]{
    flex:1; min-width:120px; border:1px solid var(--border); background:var(--surface);
    border-radius:9px; padding:8px 11px; color:var(--ink);
  }
  .chip{
    flex:none; border:1px solid var(--border); background:var(--surface);
    border-radius:100px; padding:7px 12px; font-size:12px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:5px;
  }
  .chip.active{background:var(--primary); border-color:var(--primary); color:var(--primary-ink);}
  .chip .n{opacity:.75; font-weight:500;}

  .search-dropdown{
    position:fixed; z-index:60; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); max-height:min(60vh,360px); overflow-y:auto;
    padding:6px;
  }
  .search-dropdown[hidden]{display:none;}
  .search-dropdown .sd-hint{padding:10px 8px; font-size:12.5px; color:var(--ink-faint);}
  .search-dropdown .sd-row{
    width:100%; display:flex; align-items:center; gap:9px; text-align:left;
    background:none; border:none; border-radius:8px; padding:9px 8px; cursor:pointer;
  }
  .search-dropdown .sd-row:active, .search-dropdown .sd-row:hover{background:var(--bg);}
  .search-dropdown .sd-row .status-dot{flex:none;}
  .search-dropdown .sd-body{min-width:0; flex:1; display:flex; flex-direction:column; gap:1px;}
  .search-dropdown .sd-title{font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .search-dropdown .sd-sub{font-size:12px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .search-dropdown .sd-more{padding:8px; font-size:12px; color:var(--ink-faint); text-align:center;}

  main{flex:1; min-height:0; display:flex; flex-direction:column; position:relative;}
  .view{display:none; flex:1; min-height:0; flex-direction:column;}
  .view.active{display:flex;}

  /* ---------- map ---------- */
  .map-wrap{position:relative; flex:1; min-height:0; background:var(--map-bg); overflow:hidden;}
  .map-wrap svg{display:block; width:100%; height:100%; touch-action:none; -webkit-user-select:none; user-select:none;}
  .zoom-controls{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:6px; z-index:5;
  }
  .zoom-btn{
    width:34px; height:34px; border-radius:10px; background:var(--surface); border:1px solid var(--border);
    box-shadow:var(--shadow); font-size:17px; font-weight:600; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .zoom-btn.reset{font-size:13px;}
  .map-toolbar{
    position:absolute; top:10px; left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; pointer-events:none;
  }
  .map-toolbar > *{pointer-events:auto;}
  .pill-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:100px;
    padding:7px 13px; font-size:12px; font-weight:600; color:var(--ink-soft); box-shadow:var(--shadow); cursor:pointer;
  }
  .pill-btn.active{background:var(--primary); color:var(--primary-ink); border-color:var(--primary);}
  .legend{
    position:absolute; bottom:12px; left:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:8px 10px; box-shadow:var(--shadow); font-size:11px; color:var(--ink-soft);
    display:flex; flex-direction:column; gap:4px;
  }
  .legend .row{display:flex; align-items:center; gap:6px;}
  .legend .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .map-note{
    position:absolute; bottom:12px; right:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:7px 11px; box-shadow:var(--shadow); font-size:11px; color:var(--ink-soft); max-width:150px;
  }
  .map-note a{color:var(--accent); font-weight:600;}
  .map-dot{cursor:pointer;}
  .map-dot circle.halo{opacity:0;}
  .map-dot.selected circle.halo{opacity:1;}
  /* counter-scales dots against the pan/zoom transform, so zooming in spreads
     dot CENTERS apart (real separation) without inflating dot size */
  .dot-scale-wrap{ transform:scale(var(--dot-inv-scale,1)); transform-origin:0 0; }
  .dot-label{
    font-family:var(--font-body); font-size:10px; font-weight:700; fill:var(--ink);
    paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round;
    opacity:0; pointer-events:none; transition:opacity .12s;
  }
  #map-g.labels-on .dot-label{ opacity:1; }
  #map-g.labels-on .landmark{ opacity:0; transition:opacity .12s; }
  .map-label{font-family:var(--font-body); font-size:9px; fill:var(--ink-faint);}
  .map-city{font-family:var(--font-body); font-size:9.5px; fill:var(--ink-faint); font-weight:500;}
  .map-city-dot{fill:var(--ink-faint);}

  /* ---------- list ---------- */
  .list-scroll{flex:1; overflow-y:auto; padding:10px 16px 24px; display:flex; flex-direction:column; gap:8px;}
  .list-count{font-size:11.5px; color:var(--ink-faint); padding:2px 2px 4px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px; display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left;
    width:100%; box-shadow:var(--shadow);
  }
  .status-dot{width:9px;height:9px;border-radius:50%; flex:none;}
  .card-body{min-width:0; flex:1; display:flex; flex-direction:column;}
  .card-title{font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-sub{font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .card-meta{font-size:11px; color:var(--ink-faint); margin-top:3px;}
  .chev{color:var(--ink-faint); flex:none;}

  /* ---------- dashboard ---------- */
  .dash-scroll{flex:1; overflow-y:auto; padding:14px 16px 28px; display:flex; flex-direction:column; gap:18px;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  @media (min-width:520px){ .stat-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 13px;
    display:flex; flex-direction:column; gap:2px;
  }
  .stat-tile .val{font-family:var(--font-display); font-size:26px; font-weight:600;}
  .stat-tile .lbl{font-size:11px; color:var(--ink-soft);}
  .stat-tile.warn .val{color:var(--warn);}
  .stat-tile.danger .val{color:var(--danger);}
  .stat-tile.good .val{color:var(--good);}
  h2.section-title{
    font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 2px;
  }
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .muted-link{font-size:11.5px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline;}
  .feed{display:flex; flex-direction:column; gap:0;}
  .feed-item{
    display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft);
  }
  .feed-item:last-child{border-bottom:none;}
  .feed-avatar{
    width:28px;height:28px;border-radius:50%; background:var(--primary-soft); color:var(--primary);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:none;
  }
  .feed-body{min-width:0; flex:1; display:flex; flex-direction:column;}
  .feed-top{display:flex; justify-content:space-between; gap:8px; font-size:12.5px;}
  .feed-top .who{font-weight:700;}
  .feed-top .when{color:var(--ink-faint); flex:none;}
  .feed-client{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .feed-notes{font-size:12.5px; margin-top:4px; white-space:pre-wrap; word-break:break-word;}
  .empty-hint{font-size:12.5px; color:var(--ink-faint); padding:10px 0;}
  .rank-list{display:flex; flex-direction:column; gap:7px;}
  .rank-row{display:flex; align-items:center; gap:9px; font-size:12.5px;}
  .rank-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank-bar-track{width:70px; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; flex:none;}
  .rank-bar-fill{height:100%; background:var(--primary); border-radius:4px;}
  .rank-count{width:20px; text-align:right; color:var(--ink-soft); flex:none;}

  /* ---------- sheet (detail) ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(20,24,18,.42); z-index:39; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .scrim.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--surface); border-radius:16px 16px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.2);
    max-height:88svh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .2s ease;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet.open{transform:translateY(0);}
  @media (min-width:720px){
    .sheet{ left:auto; right:16px; bottom:16px; width:400px; border-radius:16px; max-height:calc(100svh - 32px); }
  }
  .sheet-handle{width:36px;height:4px;border-radius:3px;background:var(--border);margin:9px auto 2px; flex:none;}
  .sheet-scroll{overflow-y:auto; padding:6px 18px 18px;}
  .sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-top:6px;}
  .sheet-title{font-family:var(--font-display); font-weight:600; font-size:18px; line-height:1.2;}
  .sheet-close{background:var(--surface-2); border:none; border-radius:50%; width:28px; height:28px; flex:none; cursor:pointer; color:var(--ink-soft);}
  .sheet-status{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px 3px 7px; border-radius:100px; margin-top:7px;}
  .sheet-addr{font-size:13px; color:var(--ink-soft); margin-top:8px;}
  .sheet-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .btn{
    border-radius:9px; padding:9px 13px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  }
  .btn.primary{background:var(--primary); color:var(--primary-ink); border-color:var(--primary);}
  .btn.accent{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.danger{background:var(--danger-soft); color:var(--danger); border-color:var(--danger-soft);}
  .btn.block{width:100%; justify-content:center;}
  .info-grid{margin-top:12px; display:flex; flex-direction:column; gap:7px;}
  .info-row{display:flex; gap:9px; font-size:12.5px; align-items:flex-start;}
  .info-row .k{color:var(--ink-faint); width:64px; flex:none; padding-top:1px;}
  .info-row .v{color:var(--ink); word-break:break-word;}
  .info-row a{color:var(--primary); text-decoration:none; font-weight:600;}
  .copy-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .copy-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
    border-radius:7px; padding:3px 8px; font-size:10.5px; font-weight:600; cursor:pointer; flex:none;
  }
  .copy-btn.copied{background:var(--good-soft); color:var(--good); border-color:transparent;}
  .photo-field{margin-top:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .photo-status{font-size:11.5px; color:var(--ink-faint);}
  .photo-preview{position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; border:1px solid var(--border); flex:none;}
  .photo-preview img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-remove{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; border:none;
    background:rgba(20,24,18,.6); color:#fff; font-size:10px; line-height:1; cursor:pointer;
  }
  .visit-photos{display:flex; gap:8px; margin-top:6px;}
  .visit-photos img{width:52px; height:52px; border-radius:8px; border:1px solid var(--border); object-fit:cover; display:block; cursor:pointer;}
  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:999; display:none; align-items:center; justify-content:center; padding:20px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:10px; display:block;}
  .lightbox .lb-close{position:absolute; top:14px; right:16px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:20px; line-height:1; cursor:pointer;}
  hr.sep{border:none; border-top:1px solid var(--border-soft); margin:16px 0;}
  .form textarea{
    width:100%; border:1px solid var(--border); background:var(--surface-2); border-radius:9px; padding:9px 10px;
    min-height:78px; resize:vertical; margin-top:4px;
  }
  .form input[type=text],.form input[type=date],.form select{
    width:100%; border:1px solid var(--border); background:var(--surface-2); border-radius:9px; padding:9px 10px; margin-top:4px;
    font:inherit; color:var(--ink);
  }
  .form label{font-size:11.5px; font-weight:600; color:var(--ink-soft); display:block; margin-top:10px;}
  .form label:first-child{margin-top:0;}
  .form-row{display:flex; gap:10px;}
  .form-row > div{flex:1;}
  .form-msg{font-size:11.5px; margin-top:8px; padding:7px 9px; border-radius:8px;}
  .form-msg.ok{background:var(--good-soft); color:var(--good);}
  .form-msg.err{background:var(--danger-soft); color:var(--danger);}
  .form-msg.local{background:var(--warn-soft); color:var(--warn);}
  .visit-log{margin-top:6px; display:flex; flex-direction:column; gap:10px;}
  .visit-entry{border-left:2px solid var(--border); padding-left:10px;}
  .visit-entry .vtop{font-size:12px; font-weight:700; display:flex; justify-content:space-between; gap:8px;}
  .visit-entry .vtop .d{color:var(--ink-faint); font-weight:500;}
  .visit-entry .vnotes{font-size:12.5px; margin-top:2px; white-space:pre-wrap; word-break:break-word;}
  .pending-tag{font-size:10px; color:var(--warn); font-weight:600;}
  .sync-banner{
    background:var(--warn-soft); color:var(--warn); font-size:11.5px; padding:7px 16px; text-align:center;
  }
</style>
</head>
<body>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <button type="button" class="lb-close" onclick="closeLightbox(event)">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="name">Client&nbsp;Snack&nbsp;&amp;&nbsp;Moi</span>
        <span class="sub">Prospection Snack &amp; Moi · <span id="client-count">276</span> points de vente</span>
      </div>
      <select class="me-chip" id="me-chip" title="Merchandiser / Commercial"></select>
    </div>
    <nav class="tabs">
      <button data-view="map" class="active">Carte</button>
      <button data-view="list">Liste</button>
      <button data-view="dashboard">Tableau de bord</button>
    </nav>
  </header>

  <div class="filterbar">
    <input type="search" id="search-input" placeholder="Enseigne, ville, référence…" autocomplete="off">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// Config publique du projet Firebase "suivi-client-prospection" — sans risque
// à exposer côté client (comparable à une clé d'API publique), la sécurité
// réelle est assurée par les règles Firestore (lecture publique, écriture
// validée, aucune modification/suppression après coup).
const firebaseConfig = {
  apiKey: "AIzaSyDgoO6PUklP5c24zIMNw-EVt7cJT_DEmr8",
  authDomain: "suivi-client-prospection.firebaseapp.com",
  projectId: "suivi-client-prospection",
  storageBucket: "suivi-client-prospection.firebasestorage.app",
  messagingSenderId: "997802508389",
  appId: "1:997802508389:web:815443bfc87f7e1f9f468c"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

(function(){
  "use strict";

  /* ============================= DATA ============================= */
  // ALL_CLIENTS_BASE : le fichier client d'origine, jamais modifié.
  // CLIENTS/byRef : reconstruits à chaque changement (adresse modifiée ou
  // client supprimé) en fusionnant ALL_CLIENTS_BASE avec clientOverrides.
  var ALL_CLIENTS_BASE = JSON.parse(document.getElementById('client-data-json').textContent);
  var clientOverrides = {}; // ref -> {a,p,c,lat,lng,deleted,updatedAt}
  var CLIENTS = [];
  var byRef = {};

  /* Many clients share the exact same city-level coordinates (geocoded by
     ville, not by precise address), so they sit on the exact same point and
     zooming — which only spreads points that differ — can never separate
     them. Fan out each such group in a tiny circle (a few tens of metres,
     invisible zoomed out, separated once zoomed in) so they get distinct,
     individually-tappable positions. */
  function jitterCoincidentClients(list){
    var groups = {};
    list.forEach(function(c){
      var key = c.lat.toFixed(4)+','+c.lng.toFixed(4);
      (groups[key] = groups[key] || []).push(c);
    });
    Object.keys(groups).forEach(function(key){
      var arr = groups[key];
      if(arr.length < 2) return;
      var baseDeg = 0.0011; // ~120 m at this latitude
      arr.forEach(function(c, i){
        var ring = Math.floor(i/8), posInRing = i%8, ringCount = Math.min(8, arr.length - ring*8);
        var angle = 2*Math.PI*posInRing/ringCount;
        var rad = baseDeg * (ring+1);
        var latAdj = rad * Math.sin(angle);
        var lngAdj = rad * Math.cos(angle) / Math.cos(c.lat*Math.PI/180);
        c.lat = c.lat + latAdj;
        c.lng = c.lng + lngAdj;
      });
    });
  }

  function rebuildClients(){
    var list = [];
    ALL_CLIENTS_BASE.forEach(function(base){
      var ov = clientOverrides[base.r];
      if(ov && ov.deleted) return; // client supprimé, on l'exclut
      var c = ov ? Object.assign({}, base, {
        a: (ov.a != null ? ov.a : base.a),
        p: (ov.p != null ? ov.p : base.p),
        c: (ov.c != null ? ov.c : base.c),
        lat: (ov.lat != null ? ov.lat : base.lat),
        lng: (ov.lng != null ? ov.lng : base.lng)
      }) : Object.assign({}, base);
      list.push(c);
    });
    jitterCoincidentClients(list);
    CLIENTS = list;
    var byRefTmp = {};
    CLIENTS.forEach(function(c){ byRefTmp[c.r] = c; });
    byRef = byRefTmp;
    document.getElementById('client-count').textContent = CLIENTS.length;
  }
  rebuildClients();

  /* ============================= FICHES CLIENT (adresse / suppression) ============================= */
  // Les corrections d'adresse et les suppressions sont stockées dans Firestore
  // (collection client_overrides, un document par référence client) pour rester
  // synchronisées entre tous les téléphones — jamais dans le fichier source.
  var overridesFbReady = false;
  function initClientOverrides(){
    try{
      onSnapshot(collection(db, 'client_overrides'), function(snap){
        var map = {};
        snap.forEach(function(d){ map[d.id] = d.data() || {}; });
        clientOverrides = map;
        overridesFbReady = true;
        rebuildClients();
        refreshVisitsAndRender();
      }, function(err){ overridesFbReady = false; });
    } catch(e){}
  }

  function geocodeAddress(address, postal, city){

  /* ============================= UTIL ============================= */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function normSearch(s){
    return String(s||'').toUpperCase().normalize('NFKD').replace(/[̀-ͯ]/g,'');
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function parseISO(s){
    if(!s) return null;
    var p = s.split('-');
    if(p.length!==3) return null;
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    return isNaN(d.getTime()) ? null : d;
  }
  function daysAgo(iso){
    var d = parseISO(iso);
    if(!d) return null;
    var ms = Date.now() - d.getTime();
    return Math.floor(ms/86400000);
  }
  function fmtDate(iso){
    var d = parseISO(iso);
    if(!d) return iso||'';
    return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});
  }
  function fmtRelative(iso){
    var n = daysAgo(iso);
    if(n===null) return '';
    if(n<=0) return "aujourd'hui";
    if(n===1) return 'hier';
    if(n<30) return 'il y a '+n+' j';
    if(n<365) return 'il y a '+Math.round(n/30)+' mois';
    return 'il y a '+Math.round(n/365)+' an'+(n>=730?'s':'');
  }
  function initials(name){
    name = (name||'').trim();
    if(!name) return '?';
    var parts = name.split(/\s+/);
    return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function debounce(fn, ms){
    var t; return function(){ var a=arguments, ctx=this; clearTimeout(t); t=setTimeout(function(){fn.apply(ctx,a);}, ms); };
  }

  function rebuildVisitIndex(dbDocs){

    (dbDocs||[]).forEach(add);

      byRefTmp[ref].sort(function(a,b){
        var da = a.date||'', db_ = b.date||'';
        if(da!==db_) return da < db_ ? 1 : -1;
        return (b.createdAt||0) - (a.createdAt||0);
      });
    });

  var flushInFlightIds = {};

    if(!fbReady || !pendingQueue.length) return;
    var toFlush = pendingQueue.filter(function(v){ return !flushInFlightIds[v.localId]; });
    toFlush.forEach(function(v){
      flushInFlightIds[v.localId] = true;

        date: v.date, notes: v.notes, createdAt: v.createdAt

        delete flushInFlightIds[v.localId];

        savePendingQueue();
        updateSyncBanner();
        refreshVisitsAndRender();
      }).catch(function(){
        delete flushInFlightIds[v.localId];
        /* keep in queue, will retry next flush */

  function initCapabilities(){
    try{
      var q = query(collection(db, 'visites'), orderBy('createdAt', 'desc'), limit(2000));
      onSnapshot(q, function(snap){
        fbReady = true;
        lastDbDocs = snap.docs.map(function(d){
          var data = d.data() || {};
          return {
            id: d.id, ref: data.ref, clientName: data.clientName,

      }, function(err){

  /* ============================= PHOTOS ============================= */
  // Photos redimensionnées/compressées sur l'appareil, puis stockées
  // directement dans le document de visite (base64) — pas de service de
  // stockage séparé nécessaire, tout reste centralisé dans Firestore.
  function blobToDataURL(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        canvas.toBlob(function(blob){
          URL.revokeObjectURL(url);
          if(blob) resolve(blob); else reject(new Error('compress_failed'));
        }, 'image/jpeg', quality);
      };
      img.onerror = function(e){ URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }
  var photoState = {store:null, shelf:null}; // slot -> {blob, previewUrl} pending upload
  function wirePhotoInputs(ref){
    photoState = {store:null, shelf:null};
    ['store','shelf'].forEach(function(slot){
      var input = document.getElementById('f-photo-'+slot);
      var addBtn = document.getElementById('f-photo-'+slot+'-btn');
      var preview = document.getElementById('f-photo-'+slot+'-preview');
      var img = preview ? preview.querySelector('img') : null;
      var removeBtn = preview ? preview.querySelector('.photo-remove') : null;
      var status = document.getElementById('f-photo-'+slot+'-status');
      if(!input) return;
      addBtn.addEventListener('click', function(){ input.click(); });
      input.addEventListener('change', function(){
        var file = input.files && input.files[0];
        if(!file) return;
        status.textContent = 'Compression…';
        status.hidden = false;
        compressImage(file, 900, 0.55).then(function(blob){
          photoState[slot] = { blob: blob };
          var previewUrl = URL.createObjectURL(blob);
          img.src = previewUrl;
          preview.hidden = false;
          addBtn.hidden = true;
          status.hidden = true;
          status.textContent = '';
        }).catch(function(){
          status.textContent = 'Photo illisible, réessaie.';
        });
      });
      if(removeBtn){
        removeBtn.addEventListener('click', function(){
          photoState[slot] = null;
          input.value = '';
          preview.hidden = true;
          addBtn.hidden = false;
        });
      }
    });
  }
  function uploadPendingPhotos(){
    var slots = Object.keys(photoState).filter(function(k){ return photoState[k] && photoState[k].blob; });
    if(!slots.length) return Promise.resolve({});
    return Promise.all(slots.map(function(slot){
      return blobToDataURL(photoState[slot].blob).then(function(dataUrl){
        return {slot:slot, dataUrl:dataUrl};
      }).catch(function(){ return null; });
    })).then(function(results){
      var out = {};
      results.forEach(function(r){ if(r) out[r.slot] = {dataUrl:r.dataUrl}; });
      return out;
    });
  }

  function saveVisit(ref, clientName, commercial, date, notes, photos){
    var createdAt = Date.now();
    var payload = { ref:ref, clientName:clientName, commercial:commercial, date:date, notes:notes, createdAt:createdAt };
    if(photos && photos.store) payload.photoStore = photos.store;
    if(photos && photos.shelf) payload.photoShelf = photos.shelf;
    var localVisit = Object.assign({}, payload, {localId:'l'+createdAt+Math.random().toString(36).slice(2)});
    if(fbReady){
      return addDoc(collection(db, 'visites'), payload).then(function(){
        return {ok:true, synced:true};
      }).catch(function(err){
        pendingQueue.push(localVisit);
        savePendingQueue();
        updateSyncBanner();
        refreshVisitsAndRender();
        return {ok:true, synced:false};
      });
    } else {
      pendingQueue.push(localVisit);
      savePendingQueue();
      updateSyncBanner();
      refreshVisitsAndRender();
      return Promise.resolve({ok:true, synced:false});
    }
  }

  /* ============================= MAP ============================= */
  var VB_W = 400, VB_H = 560;
  var REGION_BOUNDS = {latMin:42.55, latMax:45.05, lngMin:-3.05, lngMax:0.85};

  function computeAllBounds(){
    var lats = CLIENTS.map(function(c){return c.lat;});
    var lngs = CLIENTS.map(function(c){return c.lng;});
    // exclude extreme outliers (>2000km away) from auto-fit; they are noted separately
    var core = CLIENTS.filter(function(c){ return c.lat > 30 && c.lat < 55 && c.lng > -6 && c.lng < 10; });
    lats = core.map(function(c){return c.lat;});
    lngs = core.map(function(c){return c.lng;});
    var pad = 0.35;
    return {
      latMin: Math.min.apply(null, lats) - pad,
      latMax: Math.max.apply(null, lats) + pad,
      lngMin: Math.min.apply(null, lngs) - pad,
      lngMax: Math.max.apply(null, lngs) + pad
    };
  }

  /* ---- pan / zoom state (applied as a transform on the inner <g>, so
     points that overlap at rest can be spread apart and tapped individually) ---- */
  var mapView = {scale:1, tx:0, ty:0};
  var MIN_SCALE = 1, MAX_SCALE = 45;
  function clampScale(s){ return Math.max(MIN_SCALE, Math.min(MAX_SCALE, s)); }
  function transformStr(){ return 'translate('+mapView.tx.toFixed(2)+','+mapView.ty.toFixed(2)+') scale('+mapView.scale.toFixed(3)+')'; }
  var LABEL_ZOOM_THRESHOLD = 12;
  function applyTransform(){
    var g = document.getElementById('map-g');
    if(g){
      g.setAttribute('transform', transformStr());
      g.classList.toggle('labels-on', mapView.scale >= LABEL_ZOOM_THRESHOLD);
    }
    // keep dot size visually constant regardless of zoom level, so zooming
    // in spreads dot CENTERS apart without inflating the dots themselves
    var svg = document.getElementById('map-svg');
    if(svg) svg.style.setProperty('--dot-inv-scale', (1/mapView.scale).toFixed(4));
  }
  function svgPoint(svg, clientX, clientY){
    var pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    var ctm = svg.getScreenCTM();
    if(!ctm) return {x:0,y:0};
    var p = pt.matrixTransform(ctm.inverse());
    return {x:p.x, y:p.y};
  }
  function zoomAt(clientX, clientY, factor){
    var svg = document.getElementById('map-svg');
    var v = svgPoint(svg, clientX, clientY);
    var newScale = clampScale(mapView.scale * factor);
    if(newScale === mapView.scale) return;
    var pf = {x:(v.x - mapView.tx)/mapView.scale, y:(v.y - mapView.ty)/mapView.scale};
    mapView.scale = newScale;
    mapView.tx = v.x - newScale*pf.x;
    mapView.ty = v.y - newScale*pf.y;
    applyTransform();
  }
  function resetView(){ mapView.scale=1; mapView.tx=0; mapView.ty=0; applyTransform(); }

  function initMapGestures(){
    var wrap = document.getElementById('map-wrap');
    var svg = document.getElementById('map-svg');
    var pointers = {}; // id -> {x,y} client coords
    var mode = null;   // 'pan' | 'pinch'
    var lastV = null;
    var prevDist = 0, prevMid = null;
    var totalMove = 0;
    var suppressClick = false;

    function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
    function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
    function ids(){ return Object.keys(pointers); }

    wrap.addEventListener('pointerdown', function(e){
      if(e.target.closest('.map-toolbar, .zoom-controls, .map-note')) return;
      pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
      try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
      var n = ids().length;
      if(n === 1){
        mode = 'pan';
        lastV = svgPoint(svg, e.clientX, e.clientY);
        totalMove = 0;
      } else if(n === 2){
        mode = 'pinch';
        var a = pointers[ids()[0]], b = pointers[ids()[1]];
        prevDist = dist(a,b);
        prevMid = mid(a,b);
      }
    });

    wrap.addEventListener('pointermove', function(e){
      if(!pointers[e.pointerId]) return;
      pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
      var n = ids().length;
      if(mode === 'pan' && n === 1){
        var v = svgPoint(svg, e.clientX, e.clientY);
        var dx = v.x - lastV.x, dy = v.y - lastV.y;
        totalMove += Math.hypot(e.movementX||0, e.movementY||0);
        mapView.tx += dx; mapView.ty += dy;
        lastV = v;
        applyTransform();
      } else if(mode === 'pinch' && n === 2){
        var a = pointers[ids()[0]], b = pointers[ids()[1]];
        var d = dist(a,b);
        var m = mid(a,b);
        if(prevDist > 0){
          var factor = d / prevDist;
          zoomAt(m.x, m.y, factor);
        }
        prevDist = d; prevMid = m;
        totalMove += 10; // pinch always counts as a gesture, never a tap
      }
    });

    function endPointer(e){
      delete pointers[e.pointerId];
      var n = ids().length;
      if(n === 0){
        if(totalMove > 6){ suppressClick = true; setTimeout(function(){ suppressClick = false; }, 0); }
        mode = null;
      } else if(n === 1){
        // transition from pinch back to pan with the remaining finger
        mode = 'pan';
        var k = ids()[0];
        lastV = svgPoint(svg, pointers[k].x, pointers[k].y);
      }
    }
    wrap.addEventListener('pointerup', endPointer);
    wrap.addEventListener('pointercancel', endPointer);

    // swallow the synthetic click that follows a drag, so a pan never opens a sheet
    svg.addEventListener('click', function(e){
      if(suppressClick){ e.stopPropagation(); e.preventDefault(); }
    }, true);

    wrap.addEventListener('wheel', function(e){
      e.preventDefault();
      var factor = Math.pow(1.0015, -e.deltaY);
      zoomAt(e.clientX, e.clientY, factor);
    }, {passive:false});

    svg.addEventListener('dblclick', function(e){
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, 1.8);
    });

    document.getElementById('zoom-in').addEventListener('click', function(){
      var r = wrap.getBoundingClientRect();
      zoomAt(r.left + r.width/2, r.top + r.height/2, 1.5);
    });
    document.getElementById('zoom-out').addEventListener('click', function(){
      var r = wrap.getBoundingClientRect();
      zoomAt(r.left + r.width/2, r.top + r.height/2, 1/1.5);
    });
    document.getElementById('zoom-reset').addEventListener('click', resetView);
  }

  function project(lat, lng, bounds){
    var latSpan = bounds.latMax - bounds.latMin;
    var lngSpan = (bounds.lngMax - bounds.lngMin) * Math.cos(bounds.latMin * Math.PI/180);
    var scale = Math.min((VB_W-24) / lngSpan, (VB_H-24) / latSpan);
    var cx = VB_W/2, cy = VB_H/2;
    var lngMid = (bounds.lngMin+bounds.lngMax)/2, latMid = (bounds.latMin+bounds.latMax)/2;
    var x = cx + (lng - lngMid) * Math.cos(bounds.latMin*Math.PI/180) * scale;
    var y = cy - (lat - latMid) * scale;
    return {x:x, y:y};
  }

  function currentBounds(){
    if(state.extent === 'all'){
      if(!ALL_BOUNDS) ALL_BOUNDS = computeAllBounds();
      return ALL_BOUNDS;
    }
    return REGION_BOUNDS;
  }

  function truncateLabel(s){
    return s.length > 30 ? s.slice(0,29)+'…' : s;
  }
  function renderMap(){
    var svg = document.getElementById('map-svg');
    var bounds = currentBounds();
    var list = filteredClients();
    var visibleSet = {}; list.forEach(function(c){ visibleSet[c.r]=true; });

    var parts = [];
    // land base
    parts.push('<rect x="0" y="0" width="'+VB_W+'" height="'+VB_H+'" fill="var(--map-bg)"></rect>');

    if(state.extent === 'all'){
      // whole-country view: fill everything as sea, then cut out mainland
      // France's silhouette on top, so the shape reads instantly
      parts.push('<rect x="0" y="0" width="'+VB_W+'" height="'+VB_H+'" fill="var(--map-sea)"></rect>');
      var francePts = FRANCE_OUTLINE.map(function(p){ return project(p.lat, p.lng, bounds); });
      var francePath = 'M ' + francePts.map(function(p){ return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' L ') + ' Z';
      parts.push('<path d="'+francePath+'" fill="var(--map-bg)" stroke="var(--map-sea-line)" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>');
    } else {
      // regional view: everything west of the Atlantic coastline is sea
      var coastPts = COASTLINE.map(function(p){ return project(p.lat, p.lng, bounds); });
      var seaPath = 'M -20,-20 L ' + coastPts.map(function(p){ return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' L ') + ' L -20,'+(VB_H+20)+' Z';
      parts.push('<path d="'+seaPath+'" fill="var(--map-sea)"></path>');
      parts.push('<polyline points="'+coastPts.map(function(p){ return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ')+'" fill="none" stroke="var(--map-sea-line)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>');
      parts.push('<g transform="translate(24,80)"><g class="dot-scale-wrap"><text class="map-city" x="0" y="0" fill="var(--map-sea-line)" style="font-style:italic;">Océan Atlantique</text></g></g>');
    }

    // France / Spain border (Pyrénées)
    var borderPts = BORDER.map(function(p){ return project(p.lat, p.lng, bounds); });
    parts.push('<polyline points="'+borderPts.map(function(p){ return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ')+'" fill="none" stroke="var(--map-border)" stroke-width="1.2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"></polyline>');

    // faint reference grid (subtle, on top of land/sea)
    for(var gx=0; gx<=VB_W; gx+=40){ parts.push('<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+VB_H+'" stroke="var(--map-line)" stroke-width="0.6" opacity="0.5" vector-effect="non-scaling-stroke"></line>'); }
    for(var gy=0; gy<=VB_H; gy+=40){ parts.push('<line x1="0" y1="'+gy+'" x2="'+VB_W+'" y2="'+gy+'" stroke="var(--map-line)" stroke-width="0.6" opacity="0.5" vector-effect="non-scaling-stroke"></line>'); }

    // landmarks — counter-scaled like client dots, so their pin stays put at
    // the right spot and their label doesn't balloon (and drift off-center) on zoom
    LANDMARKS.forEach(function(l){
      var p = project(l.lat, l.lng, bounds);
      if(p.x<-10||p.x>VB_W+10||p.y<-10||p.y>VB_H+10) return;
      parts.push(
        '<g class="landmark" transform="translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')">'+
        '<g class="dot-scale-wrap">'+
        '<circle class="map-city-dot" cx="0" cy="0" r="2"></circle>'+
        '<text class="map-city" x="4" y="3">'+esc(l.n)+'</text>'+
        '</g></g>'
      );
    });

    // client dots (dim ones not in current filter)
    var outlierCount = 0;
    CLIENTS.forEach(function(c){
      var p = project(c.lat, c.lng, bounds);
      var onscreen = p.x>=-6 && p.x<=VB_W+6 && p.y>=-6 && p.y<=VB_H+6;
      if(!onscreen){ if(visibleSet[c.r]) outlierCount++; return; }
      var status = clientStatus(c.r);
      var colorVar = statusColorVar(status);
      var dim = !visibleSet[c.r];
      var sel = state.selectedRef === c.r;
      var r = sel ? 6.5 : 4.2;
      // Nom complet, avant ET après le tiret, sur deux lignes (tspans) plutôt
      // que tronqué à la première partie.
      var nameParts = c.n.split(/\s*-\s*/);
      var labelLine1 = truncateLabel(nameParts[0].trim());
      var labelLine2 = nameParts.length > 1 ? truncateLabel(nameParts.slice(1).join(' - ').trim()) : '';
      var labelX = (r+4);
      var labelTspans = '<tspan x="'+labelX+'" dy="0">'+esc(labelLine1)+'</tspan>'+
        (labelLine2 ? '<tspan x="'+labelX+'" dy="11">'+esc(labelLine2)+'</tspan>' : '');
      parts.push(
        '<g class="map-dot'+(sel?' selected':'')+'" data-ref="'+c.r+'" transform="translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')" opacity="'+(dim?0.22:1)+'" tabindex="0" role="button" aria-label="'+esc(c.n)+'">'+
        '<g class="dot-scale-wrap">'+
        '<circle class="halo" cx="0" cy="0" r="11" fill="var('+colorVar+')" opacity="0.22"></circle>'+
        '<circle cx="0" cy="0" r="'+r+'" fill="var('+colorVar+')" stroke="var(--surface)" stroke-width="1.4"></circle>'+
        '<text class="dot-label" x="'+labelX+'" y="3.5">'+labelTspans+'</text>'+
        '</g></g>'
      );
    });

    svg.innerHTML = '<g id="map-g">' + parts.join('') + '</g>';
    applyTransform();
    svg.querySelectorAll('.map-dot').forEach(function(el){
      el.addEventListener('click', function(){ handleDotTap(el.getAttribute('data-ref')); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handleDotTap(el.getAttribute('data-ref')); } });
    });

    var noteEl = document.getElementById('map-note');
    if(state.extent==='region' && outlierCount>0){
      noteEl.hidden = false;
      noteEl.innerHTML = outlierCount + ' client' + (outlierCount>1?'s':'') + ' hors zone. <a href="#" id="map-note-link">Voir en liste</a>';
      var link = document.getElementById('map-note-link');
      if(link) link.addEventListener('click', function(e){ e.preventDefault(); switchView('list'); });
    } else {
      noteEl.hidden = true;
    }
  }

  /* ============================= LIST ============================= */
  function renderList(){
    var el = document.getElementById('list-scroll');
    var list = filteredClients().slice().sort(function(a,b){ return a.n.localeCompare(b.n,'fr'); });
    var html = '<div class="list-count">'+list.length+' point'+(list.length>1?'s':'')+' de vente</div>';
    list.forEach(function(c){
      var status = clientStatus(c.r);
      var lv = lastVisit(c.r);
      html += '<button class="card" data-ref="'+c.r+'" type="button">'+
        '<span class="status-dot" style="background:var('+statusColorVar(status)+')"></span>'+
        '<span class="card-body">'+
          '<span class="card-title">'+esc(c.n)+'</span>'+
          '<span class="card-sub">'+esc(c.c)+(c.k?' · '+esc(c.k):'')+'</span>'+
          '<span class="card-meta">'+(lv ? 'Dernière visite '+fmtRelative(lv.date) : 'Pas encore visité')+'</span>'+
        '</span>'+
        '<span class="chev">›</span>'+
      '</button>';
    });
    if(!list.length) html += '<div class="empty-hint">Aucun client ne correspond à ces filtres.</div>';
    el.innerHTML = html;
    el.querySelectorAll('.card').forEach(function(card){
      card.addEventListener('click', function(){ openSheet(card.getAttribute('data-ref')); });
    });
  }

  /* ============================= DASHBOARD ============================= */
  function allVisitsFlat(){
    var out = [];
    Object.keys(visitsByRef).forEach(function(ref){ visitsByRef[ref].forEach(function(v){ out.push(v); }); });
    out.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    return out;
  }
  window.exportVisitsToExcel = function(){
    var flat = allVisitsFlat();
    if(!flat.length){ alert('Aucune visite à exporter pour le moment.'); return; }
    var refToClient = {};
    CLIENTS.forEach(function(c){ refToClient[c.r] = c; });
    var rows = flat.map(function(v){
      var c = refToClient[v.ref];
      return {
        'Date': v.date || '',
        'Enseigne': v.clientName || (c ? c.n : ''),
        'Ville': c ? c.c : '',
        'Référence client': v.ref || '',
        'Merch / cial': v.commercial || '',
        'Commentaire': v.notes || '',
        'Photo magasin': v.photoStore ? 'Oui' : '',
        'Photo rayon': v.photoShelf ? 'Oui' : ''
      };
    });
    var ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:12},{wch:30},{wch:18},{wch:14},{wch:14},{wch:50},{wch:12},{wch:12}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Visites');
    var today = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, 'visites-snack-et-moi-'+today+'.xlsx');
  };
  function renderDashboard(){
    var el = document.getElementById('dash-scroll');
    var now = Date.now();
    var weekAgo = now - 7*86400000, monthAgo = now - 30*86400000;
    var flat = allVisitsFlat();
    var visitsWeek = flat.filter(function(v){ return v.createdAt >= weekAgo; }).length;
    var visitsMonth = flat.filter(function(v){ return v.createdAt >= monthAgo; }).length;
    var never=0, due=0;
    CLIENTS.forEach(function(c){ var s=clientStatus(c.r); if(s==='never') never++; else if(s==='due') due++; });

    var byCommercial = {};
    flat.forEach(function(v){
      var name = (v.commercial||'Non renseigné').trim() || 'Non renseigné';
      byCommercial[name] = (byCommercial[name]||0) + 1;
    });
    var commList = Object.keys(byCommercial).map(function(k){ return {name:k, count:byCommercial[k]}; })
      .sort(function(a,b){ return b.count-a.count; }).slice(0,8);
    var maxCount = commList.length ? commList[0].count : 1;

    var html = '';
    html += '<div class="stat-grid">'+
      '<div class="stat-tile"><span class="val tabular">'+CLIENTS.length+'</span><span class="lbl">Clients au total</span></div>'+
      '<div class="stat-tile danger"><span class="val tabular">'+never+'</span><span class="lbl">Pas encore visités</span></div>'+
      '<div class="stat-tile warn"><span class="val tabular">'+due+'</span><span class="lbl">À relancer (+'+DUE_DAYS+'j)</span></div>'+
      '<div class="stat-tile good"><span class="val tabular">'+visitsWeek+'</span><span class="lbl">Visites cette semaine</span></div>'+
    '</div>';
    html += '<button type="button" class="btn block" style="margin-top:12px;" onclick="exportVisitsToExcel()">Exporter les visites en Excel ('+flat.length+')</button>';

    html += '<div><div class="section-head"><h2 class="section-title">Par commercial</h2></div>';
    if(commList.length){
      html += '<div class="rank-list" style="margin-top:10px;">';
      commList.forEach(function(r){
        var pct = Math.max(6, Math.round(100*r.count/maxCount));
        html += '<div class="rank-row"><span class="rank-name">'+esc(r.name)+'</span>'+
          '<span class="rank-bar-track"><span class="rank-bar-fill" style="width:'+pct+'%"></span></span>'+
          '<span class="rank-count tabular">'+r.count+'</span></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-hint">Aucun compte rendu enregistré pour le moment.</div>';
    }
    html += '<div class="empty-hint" style="padding-top:8px;">'+visitsMonth+' visite'+(visitsMonth>1?'s':'')+' sur les 30 derniers jours.</div></div>';

    var dateFiltered = state.dashDate ? flat.filter(function(v){ return v.date === state.dashDate; }) : null;
    var recent = dateFiltered ? dateFiltered : flat.slice(0, 25);

    html += '<div>'+
      '<div class="section-head">'+
        '<h2 class="section-title">'+(dateFiltered ? 'Visites du '+fmtDate(state.dashDate) : 'Derniers comptes rendus')+'</h2>'+
      '</div>'+
      '<div style="display:flex; align-items:center; gap:8px; margin-top:8px;">'+
        '<input type="date" id="dash-date-filter" value="'+esc(state.dashDate||'')+'" style="border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:7px 9px; font-size:12.5px; color:var(--ink);">'+
        (state.dashDate ? '<button class="muted-link" id="dash-date-clear" type="button">Effacer</button>' : '')+
      '</div>'+
      '<div class="feed" style="margin-top:6px;">';
    if(!recent.length){
      html += '<div class="empty-hint">'+(dateFiltered ? 'Aucune visite ce jour-là.' : 'Rien à afficher pour l\'instant — les comptes rendus des commerciaux apparaîtront ici.')+'</div>';
    } else {
      recent.forEach(function(v){
        var name = v.commercial || 'Non renseigné';
        var photosHtml = '';
        if(v.photoStore || v.photoShelf){
          photosHtml = '<div class="visit-photos">'+
            (v.photoStore ? '<img src="'+v.photoStore.dataUrl+'" alt="Photo du magasin" title="Photo du magasin" onclick="openLightbox(this.src)">' : '')+
            (v.photoShelf ? '<img src="'+v.photoShelf.dataUrl+'" alt="Photo du rayon" title="Photo du rayon" onclick="openLightbox(this.src)">' : '')+
          '</div>';
        }
        html += '<div class="feed-item">'+
          '<span class="feed-avatar">'+esc(initials(name))+'</span>'+
          '<span class="feed-body">'+
            '<span class="feed-top"><span class="who">'+esc(name)+'</span><span class="when">'+(dateFiltered ? '' : fmtRelative(v.date))+(v.synced===false?' <span class="pending-tag">· en attente</span>':'')+'</span></span>'+
            '<span class="feed-client">'+esc(v.clientName || (byRef[v.ref]&&byRef[v.ref].n) || v.ref)+'</span>'+
            (v.notes ? '<span class="feed-notes">'+esc(v.notes)+'</span>' : '')+
            photosHtml+
          '</span>'+
        '</div>';
      });
    }
    html += '</div></div>';

    el.innerHTML = html;
    var dateInput = document.getElementById('dash-date-filter');
    if(dateInput) dateInput.addEventListener('change', function(){ state.dashDate = dateInput.value || ''; renderDashboard(); });
    var clearBtn = document.getElementById('dash-date-clear');
    if(clearBtn) clearBtn.addEventListener('click', function(){ state.dashDate = ''; renderDashboard(); });
  }

  /* ============================= MAP TAP DISAMBIGUATION ============================= */
  // When several clients sit close together on screen (same city, or not
  // zoomed in enough yet to fully separate them), tapping one opens a small
  // picker listing all the nearby ones instead of guessing which was meant.
  var PICK_RADIUS_SVG = 9;
  function screenPosOf(c, bounds){
    var p = project(c.lat, c.lng, bounds);
    return { x: mapView.scale*p.x + mapView.tx, y: mapView.scale*p.y + mapView.ty, world:p };
  }
  function handleDotTap(ref){
    var target = byRef[ref];
    if(!target) return;
    var bounds = currentBounds();
    var tp = screenPosOf(target, bounds);
    var nearby = filteredClients().filter(function(c){
      var sp = screenPosOf(c, bounds);
      return Math.hypot(sp.x-tp.x, sp.y-tp.y) <= PICK_RADIUS_SVG;
    });
    if(nearby.length > 1){
      openPicker(nearby, ref);
    } else {
      openSheet(ref);
    }
  }

  function photoFieldHtml(slot, label){
    return '<label>'+esc(label)+'</label>'+
      '<div class="photo-field">'+
      '<input type="file" accept="image/*" capture="environment" id="f-photo-'+slot+'" style="display:none;">'+
      '<button type="button" class="btn" id="f-photo-'+slot+'-btn">Ajouter une photo</button>'+
      '<span class="photo-status" id="f-photo-'+slot+'-status" hidden></span>'+
      '<div class="photo-preview" id="f-photo-'+slot+'-preview" hidden>'+
        '<img src="" alt="'+esc(label)+'">'+
        '<button type="button" class="photo-remove" aria-label="Retirer la photo">✕</button>'+
      '</div>'+
      '</div>';
  }

  /* ============================= SHEET (detail) ============================= */
  function openSheet(ref){
    state.selectedRef = ref;
    renderSheet(ref);
    document.getElementById('scrim').classList.add('open');
    document.getElementById('sheet').classList.add('open');
    if(state.view === 'map') renderMap();
  }
  function openPicker(list, highlightRef){
    list = list.slice().sort(function(a,b){ return a.n.localeCompare(b.n,'fr'); });
    var html = '<div class="sheet-head"><span class="sheet-title">'+list.length+' clients ici</span>'+
      '<button class="sheet-close" id="sheet-close" type="button" aria-label="Fermer">✕</button></div>'+
      '<div class="empty-hint" style="padding-top:2px;">Ces points de vente sont trop proches pour être distingués sur la carte à ce niveau de zoom. Choisis celui qui t\'intéresse, ou zoome davantage.</div>'+
      '<div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">';
    list.forEach(function(c){
      var status = clientStatus(c.r);
      var lv = lastVisit(c.r);
      html += '<button class="card" data-ref="'+c.r+'" type="button" style="'+(c.r===highlightRef?'border-color:var(--primary);':'')+'">'+
        '<span class="status-dot" style="background:var('+statusColorVar(status)+')"></span>'+
        '<span class="card-body">'+
          '<span class="card-title">'+esc(c.n)+'</span>'+
          '<span class="card-sub">'+esc(c.c)+(c.k?' · '+esc(c.k):'')+'</span>'+
          '<span class="card-meta">'+(lv ? 'Dernière visite '+fmtRelative(lv.date) : 'Pas encore visité')+'</span>'+
        '</span><span class="chev">›</span></button>';
    });
    html += '</div>';
    document.getElementById('sheet-scroll').innerHTML = html;
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    document.querySelectorAll('#sheet-scroll .card').forEach(function(card){
      card.addEventListener('click', function(){ openSheet(card.getAttribute('data-ref')); });
    });
    state.selectedRef = null;
    document.getElementById('scrim').classList.add('open');
    document.getElementById('sheet').classList.add('open');
  }
  /* ============================= SEARCH DROPDOWN ============================= */
  function hideSearchDropdown(){
    document.getElementById('search-dropdown').hidden = true;
  }
  function positionSearchDropdown(){
    var input = document.getElementById('search-input');
    var dd = document.getElementById('search-dropdown');
    var r = input.getBoundingClientRect();
    dd.style.left = r.left + 'px';
    dd.style.top = (r.bottom + 6) + 'px';
    dd.style.width = r.width + 'px';
  }
  function renderSearchDropdown(){
    var dd = document.getElementById('search-dropdown');
    var q = state.search.trim();
    if(state.view !== 'map' || !q){ dd.hidden = true; return; }
    var matches = filteredClients().slice().sort(function(a,b){ return a.n.localeCompare(b.n,'fr'); });
    var cap = 30;
    var html = '';
    if(matches.length === 0){
      html = '<div class="sd-hint">Aucun client trouvé.</div>';
    } else {
      matches.slice(0,cap).forEach(function(c){
        var status = clientStatus(c.r);
        var lv = lastVisit(c.r);
        html += '<button class="sd-row" type="button" data-ref="'+c.r+'">'+
          '<span class="status-dot" style="background:var('+statusColorVar(status)+')"></span>'+
          '<span class="sd-body">'+
            '<span class="sd-title">'+esc(c.n)+'</span>'+
            '<span class="sd-sub">'+esc(c.c)+(lv?' · '+fmtRelative(lv.date):' · Pas encore visité')+'</span>'+
          '</span></button>';
      });
      if(matches.length > cap){
        html += '<div class="sd-more">+ '+(matches.length-cap)+' autres résultats…</div>';
      }
    }
    dd.innerHTML = html;
    dd.hidden = false;
    positionSearchDropdown();
    dd.querySelectorAll('.sd-row').forEach(function(row){
      row.addEventListener('click', function(){
        var ref = row.getAttribute('data-ref');
        dd.hidden = true;
        openSheet(ref);
      });
    });
  }
  function closeSheet(){
    state.selectedRef = null;
    document.getElementById('scrim').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
    if(state.view === 'map') renderMap();
  }
  function renderSheet(ref){
    var c = byRef[ref];
    if(!c) return;
    var status = clientStatus(ref);
    var visits = visitsByRef[ref] || [];
    var mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(c.a + ', ' + c.p + ' ' + c.c);
    var html = '';
    html += '<div class="sheet-head">'+
      '<span class="sheet-title">'+esc(c.n)+'</span>'+
      '<button class="sheet-close" id="sheet-close" type="button" aria-label="Fermer">✕</button>'+
    '</div>';
    html += '<span class="sheet-status" style="background:var('+statusColorVar(status)+'-soft, var(--surface-2)); color:var('+statusColorVar(status)+')">'+
      '<span style="width:6px;height:6px;border-radius:50%;background:var('+statusColorVar(status)+')"></span>'+statusLabel(status)+
    '</span>';
    html += '<div class="sheet-addr">'+esc(c.a)+'<br>'+esc(c.p)+' '+esc(c.c)+'</div>';
    html += '<div class="sheet-actions">'+
      '<a class="btn accent" href="'+mapsUrl+'" target="_blank" rel="noopener">Itinéraire</a>'+
      '<button type="button" class="btn" onclick="toggleAddressEdit()">Modifier l\'adresse</button>'+
      '<button type="button" class="btn danger" onclick="deleteClient(\''+ref.replace(/'/g,"\\'")+'\')">Supprimer ce client</button>'+
    '</div>';
    html += '<div class="form" id="edit-addr-box" hidden style="margin-top:10px;">'+
      '<label for="edit-addr">Adresse (numéro et rue)</label>'+
      '<input type="text" id="edit-addr" value="'+esc(c.a)+'" placeholder="Adresse du magasin, pas du siège">'+
      '<div class="form-row">'+
        '<div><label for="edit-postal">Code postal</label><input type="text" id="edit-postal" value="'+esc(c.p)+'"></div>'+
        '<div><label for="edit-city">Ville</label><input type="text" id="edit-city" value="'+esc(c.c)+'"></div>'+
      '</div>'+
      '<button type="button" class="btn primary block" id="edit-addr-save" style="margin-top:10px;" onclick="saveClientAddress(\''+ref.replace(/'/g,"\\'")+'\')">Enregistrer la nouvelle adresse</button>'+
      '<div id="edit-addr-msg"></div>'+
    '</div>';
    html += '<div class="info-grid">'+
      '<div class="info-row"><span class="k">Référence</span><span class="v tabular">'+esc(c.r)+'</span></div>'+
      (c.k ? '<div class="info-row"><span class="k">Contact</span><span class="v">'+esc(c.k)+'</span></div>' : '')+
      (c.t ? '<div class="info-row"><span class="k">Téléphone</span><span class="v copy-row"><span class="tabular" style="-webkit-user-select:text;user-select:text;">'+esc(c.t)+'</span><button class="copy-btn" data-copy="'+esc(c.t)+'" type="button" title="Copier">Copier</button></span></div>' : '')+
      (c.e ? '<div class="info-row"><span class="k">Email</span><span class="v copy-row"><span style="-webkit-user-select:text;user-select:text; word-break:break-all;">'+esc(c.e)+'</span><button class="copy-btn" data-copy="'+esc(c.e)+'" type="button" title="Copier">Copier</button></span></div>' : '')+
    '</div>';

    html += '<hr class="sep">';
    html += '<h2 class="section-title">Nouveau compte rendu</h2>';
    html += '<div class="form">'+
      '<label for="f-commercial">Merchandiser / Commercial</label>'+
      '<select id="f-commercial">'+
        '<option value="">Choisir…</option>'+
        COMMERCIALS.map(function(nm){ return '<option value="'+esc(nm)+'"'+(nm===state.commercial?' selected':'')+'>'+esc(nm)+'</option>'; }).join('')+
      '</select>'+
      '<div class="form-row">'+
        '<div><label for="f-date">Date de visite</label><input type="date" id="f-date" value="'+todayISO()+'"></div>'+
      '</div>'+
      '<label for="f-notes">Compte rendu</label>'+
      '<textarea id="f-notes" placeholder="Accueil, commande, remarques, prochaine étape…"></textarea>'+
      photoFieldHtml('store','Photo du magasin')+
      photoFieldHtml('shelf','Photo du rayon')+
      '<button class="btn primary block" id="f-save" type="button" style="margin-top:14px;">Enregistrer la visite</button>'+
      '<div id="f-msg"></div>'+
    '</div>';

    html += '<hr class="sep">';
    html += '<h2 class="section-title">Historique ('+visits.length+')</h2>';
    if(visits.length){
      html += '<div class="visit-log">';
      visits.forEach(function(v){
        var photosHtml = '';
        if(v.photoStore || v.photoShelf){
          photosHtml = '<div class="visit-photos">'+
            (v.photoStore ? '<img src="'+v.photoStore.dataUrl+'" alt="Photo du magasin" title="Photo du magasin" onclick="openLightbox(this.src)">' : '')+
            (v.photoShelf ? '<img src="'+v.photoShelf.dataUrl+'" alt="Photo du rayon" title="Photo du rayon" onclick="openLightbox(this.src)">' : '')+
          '</div>';
        }
        html += '<div class="visit-entry">'+
          '<div class="vtop"><span>'+esc(v.commercial||'Non renseigné')+(v.synced===false?' <span class="pending-tag">· en attente</span>':'')+'</span><span class="d">'+fmtDate(v.date)+'</span></div>'+
          (v.notes ? '<div class="vnotes">'+esc(v.notes)+'</div>' : '')+
          photosHtml+
        '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-hint">Aucune visite enregistrée pour ce client.</div>';
    }

    document.getElementById('sheet-scroll').innerHTML = html;
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    document.getElementById('f-save').addEventListener('click', function(){ submitVisit(ref); });
    document.querySelectorAll('.copy-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var text = btn.getAttribute('data-copy');
        var done = function(){
          var prev = btn.textContent;
          btn.textContent = 'Copié';
          btn.classList.add('copied');
          setTimeout(function(){ btn.textContent = prev; btn.classList.remove('copied'); }, 1400);
        };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(done).catch(function(){});
        }
      });
    });
    wirePhotoInputs(ref);
  }

  function submitVisit(ref){
    var c = byRef[ref];
    var commercial = document.getElementById('f-commercial').value.trim();
    var date = document.getElementById('f-date').value || todayISO();
    var notes = document.getElementById('f-notes').value.trim();
    var msgEl = document.getElementById('f-msg');
    if(!commercial){
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'Indique le nom du commercial avant d\'enregistrer.';
      msgEl.style.display='block';
      return;
    }
    state.commercial = commercial;
    try{ localStorage.setItem('snm_commercial_name', commercial); }catch(e){}
    renderMeChip();

    var saveBtn = document.getElementById('f-save');
    saveBtn.disabled = true;
    var hasPhotos = (photoState.store && photoState.store.blob) || (photoState.shelf && photoState.shelf.blob);
    saveBtn.textContent = hasPhotos ? 'Envoi des photos…' : 'Enregistrement…';

    uploadPendingPhotos().then(function(photos){
      saveBtn.textContent = 'Enregistrement…';
      return saveVisit(ref, c.n, commercial, date, notes, photos);
    }).then(function(res){
      saveBtn.disabled = false;
      saveBtn.textContent = 'Enregistrer la visite';
      msgEl.style.display='block';
      if(res.synced){
        msgEl.className = 'form-msg ok';
        msgEl.textContent = 'Compte rendu enregistré et synchronisé.';
      } else {
        msgEl.className = 'form-msg local';
        msgEl.textContent = 'Compte rendu enregistré sur cet appareil (sera synchronisé dès que possible).';
      }
      refreshVisitsAndRender();
    });
  }

  /* ============================= VIEW SWITCHING ============================= */
  function switchView(v){
    state.view = v;
    document.querySelectorAll('nav.tabs button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-view')===v);
    });
    document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById('view-'+v).classList.add('active');
    hideSearchDropdown();
    renderCurrentView();
  }
  function renderCurrentView(){
    if(state.view==='map') renderMap();
    else if(state.view==='list') renderList();
    else if(state.view==='dashboard') renderDashboard();
  }

  function renderMeChip(){
    var sel = document.getElementById('me-chip');
    var html = '<option value="">Choisir mon nom</option>';
    COMMERCIALS.forEach(function(nm){
      html += '<option value="'+esc(nm)+'"'+(nm===state.commercial?' selected':'')+'>'+esc(nm)+'</option>';
    });
    sel.innerHTML = html;
  }

  /* ============================= WIRING ============================= */
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.addEventListener('click', function(){ switchView(b.getAttribute('data-view')); });
  });
  document.querySelectorAll('.filterbar .chip').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.filterbar .chip').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      state.status = b.getAttribute('data-status');
      renderCurrentView();
    });
  });
  document.getElementById('search-input').addEventListener('input', debounce(function(e){
    state.search = e.target.value;
    renderCurrentView();
    renderSearchDropdown();
  }, 120));
  document.getElementById('search-input').addEventListener('focus', function(){
    renderSearchDropdown();
  });
  document.addEventListener('click', function(e){
    var dd = document.getElementById('search-dropdown');
    if(dd.hidden) return;
    if(e.target.closest('#search-dropdown') || e.target.closest('#search-input')) return;
    dd.hidden = true;
  });
  window.addEventListener('resize', function(){
    var dd = document.getElementById('search-dropdown');
    if(!dd.hidden) positionSearchDropdown();
  });
  document.getElementById('scrim').addEventListener('click', closeSheet);
  document.getElementById('btn-extent-region').addEventListener('click', function(){
    state.extent='region';
    this.classList.add('active');
    document.getElementById('btn-extent-all').classList.remove('active');
    mapView.scale=1; mapView.tx=0; mapView.ty=0;
    renderMap();
  });
  document.getElementById('btn-extent-all').addEventListener('click', function(){
    state.extent='all';
    this.classList.add('active');
    document.getElementById('btn-extent-region').classList.remove('active');
    mapView.scale=1; mapView.tx=0; mapView.ty=0;
    renderMap();
  });
  document.getElementById('me-chip').addEventListener('change', function(e){
    state.commercial = e.target.value;
    try{ localStorage.setItem('snm_commercial_name', state.commercial); }catch(e){}
  });

  /* ============================= BOOT ============================= */
  renderMeChip();
  renderCounts();
  renderCurrentView();
  updateSyncBanner();
  initCapabilities();
  initClientOverrides();
  initMapGestures();
})();
</script>
</body>
</html>
